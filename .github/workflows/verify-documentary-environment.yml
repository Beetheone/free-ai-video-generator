name: Verify Gemini documentary environment

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/model.json'
      - 'requirements.txt'
      - '.github/workflows/verify-documentary-environment.yml'

permissions:
  contents: read

concurrency:
  group: documentary-environment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-documentary.txt
      - name: Install CPU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-documentary.txt
      - name: Verify real services with small requests
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_MAX_CALLS: '1'
        run: python -m documentary.preflight
      - name: Publish safe results
        if: always()
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          for path in sorted(Path('output/environment-checks').glob('*/report.json')):
              report = json.loads(path.read_text(encoding='utf-8'))
              for name, check in report['checks'].items():
                  message = name + ': ' + json.dumps(check, ensure_ascii=False)
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  level = 'notice' if check['status'] == 'PASS' else 'error'
                  print('::' + level + ' title=Environment check::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('<pre>' + html.escape(json.dumps(report, ensure_ascii=False, indent=2)) + '</pre>\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-check-${{ github.run_id }}
          path: |
            output/environment-checks/**/report.json
            output/environment-checks/**/voice-sample.wav
            output/environment-checks/**/voice-sample.srt
          if-no-files-found: warn
          retention-days: 7
