
name: Render Chinese documentary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r requirements.txt
          pip install piper-tts opencc-python-reimplemented

      - name: Download Chinese voice model
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --output models/zh_CN-huayan-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx"
          curl --fail --location --retry 3 --output models/zh_CN-huayan-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/zh/zh_CN/huayan/medium/zh_CN-huayan-medium.onnx.json"
          test $(wc -c < models/zh_CN-huayan-medium.onnx) -gt 50000000

      - name: Validate Python sources
        run: python -m py_compile render.py media_assets.py open_video.py pixabay_video.py piper_voice.py

      - name: Restore Pixabay API cache
        uses: actions/cache@v4
        with:
          path: .pixabay_cache
          key: pixabay-queries-${{ github.run_id }}
          restore-keys: |
            pixabay-queries-

      - name: Render video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python render.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentary-output
          path: |
            output/*.mp4
            output/*.srt
            output/render_report.json
            output/media_credits.json
          if-no-files-found: warn
          retention-days: 7
