name: One Topic Game Documentary

on:
  push:
    paths: ['config/topics.json']
  workflow_dispatch:
    inputs:
      topic:
        description: '繁體中文遊戲題材（缺乏可信資料或合法畫面會明確失敗）'
        required: true
        type: string
      minutes:
        description: '目標分鐘數'
        type: choice
        default: '12'
        options: ['10', '12', '15']
      goal:
        description: '輸出階段：script 研究與腳本；research 證據；movie 完整影片'
        type: choice
        default: movie
        options: [movie, script, research]
      tts:
        description: '旁白：Kokoro CPU 普通話已實測；Edge 台灣中文目前無音訊'
        type: choice
        default: kokoro
        options: [edge, kokoro]
  schedule:
    # 09:20 Asia/Taipei. Queue is empty until configured.
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: game-documentary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-documentary.txt
      - name: Check daily queue
        id: queue
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          topics = json.load(open('config/topics.json', encoding='utf-8'))
          assert isinstance(topics, list) and len(topics) <= 3
          assert all(isinstance(t, str) and t.strip() and len(t) <= 500 for t in topics)
          active = os.environ['EVENT'] == 'workflow_dispatch' or bool(topics)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          if not active:
              print('Daily queue empty; no production attempted.')
          PY
      - name: Install CPU tools
        if: steps.queue.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-documentary.txt
      - name: Optional Kokoro CPU
        if: steps.queue.outputs.active == 'true' && (inputs.goal || 'movie') == 'movie' && (inputs.tts || 'kokoro') == 'kokoro'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install -r requirements-kokoro-cpu.txt
          python -m pip check
      - name: Record prerequisite diagnosis without network calls
        if: steps.queue.outputs.active == 'true' && (inputs.goal || 'movie') == 'movie'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          TTS: ${{ inputs.tts || 'kokoro' }}
        run: python -m documentary.doctor --tts "$TTS" --out output/environment-diagnosis.json
      - name: Produce and enforce all gates
        id: produce
        if: steps.queue.outputs.active == 'true'
        env:
          TOPIC: ${{ inputs.topic }}
          MINUTES: ${{ inputs.minutes || '12' }}
          TTS: ${{ inputs.tts || 'kokoro' }}
          EVENT: ${{ github.event_name }}
          GOAL: ${{ inputs.goal || 'movie' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_MAX_CALLS: '180'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python topic_pipeline.py --topic "$TOPIC" --minutes "$MINUTES" --tts "$TTS" --stop-after "$GOAL"
          else
            python topic_pipeline.py --topics-file config/topics.json --minutes "$MINUTES" --tts "$TTS" --stop-after "$GOAL"
          fi
      - name: Inspect footage permission leads for research milestones
        if: always() && steps.queue.outputs.active == 'true' && (inputs.goal || 'movie') != 'movie'
        run: python -m documentary.rights_probe --root output/documentaries
      - name: Diagnose ambiguous provider failures without generation
        if: failure() && steps.produce.outcome == 'failure'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
        run: python -m documentary.probe --after-failed-run output/documentaries --out output/model-diagnosis.json
      - name: Publish diagnostic summary
        if: always() && steps.queue.outputs.active == 'true'
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          reports = sorted(Path('output/documentaries').glob('*/qa_report.json'))
          chunks = ['# Documentary run results\n\n']
          if not reports:
              chunks.append('No production report was created. Check installation and prerequisite diagnosis.\n\n')
          for path in reports:
              report = json.loads(path.read_text(encoding='utf-8'))
              chunks.append('<pre>' + html.escape(json.dumps(report, ensure_ascii=False, indent=2)) + '</pre>\n\n')
              if report.get('status') not in ('COMPLETE_AUTOMATED_CHECKS', 'SCRIPT_READY', 'RESEARCH_READY'):
                  blocker = report.get('blocker', {})
                  message = report.get('failed_stage', 'unknown') + ': ' + blocker.get('code', 'UNKNOWN') + ' — ' + blocker.get('detail', 'Inspect qa_report.json')
                  if report.get('diagnostics'):
                      message += '; diagnostics=' + json.dumps(report['diagnostics'])
                  # Escape workflow-command data; topic/provider data cannot inject commands.
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Documentary blocked::' + message)
          diagnosis = Path('output/environment-diagnosis.json')
          if diagnosis.exists():
              data = json.loads(diagnosis.read_text(encoding='utf-8'))
              chunks.append('<details><summary>Prerequisite metadata (does not prove service readiness)</summary><pre>' + html.escape(json.dumps(data, ensure_ascii=False, indent=2)) + '</pre></details>\n')
              if data.get('status') == 'PREREQUISITES_BLOCKED':
                  message = '; '.join(data.get('missing_prerequisites', [])) or 'Startup policy denies required destinations; inspect environment-diagnosis.json'
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Prerequisites blocked::' + message)
          catalog = Path('output/model-diagnosis.json')
          if catalog.exists():
              data = json.loads(catalog.read_text(encoding='utf-8'))
              chunks.append('<pre>' + html.escape(json.dumps(data, ensure_ascii=False, indent=2)) + '</pre>\n')
              if data.get('status') != 'NOT_NEEDED':
                  message = 'status=' + str(data.get('status')) + '; hostname=' + str(data.get('provider_hostname')) + '; HTTP=' + str(data.get('http_status')) + '; chosen_model_listed=' + str(data.get('chosen_model_listed'))
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=Read-only model diagnosis::' + message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(''.join(chunks))
          PY
      - name: Upload finished output and diagnostic reports
        if: always() && steps.queue.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-documentary-${{ github.run_id }}
          path: |
            output/environment-diagnosis.json
            output/model-diagnosis.json
            output/documentaries/**/documentary.mp4
            output/documentaries/**/documentary.srt
            output/documentaries/**/thumbnail.jpg
            output/documentaries/**/ATTRIBUTION.md
            output/documentaries/**/PROGRESS.md
            output/documentaries/**/SCRIPT.md
            output/documentaries/**/FOOTAGE_GAPS.md
            output/documentaries/**/*.json
          if-no-files-found: warn
          retention-days: 7
