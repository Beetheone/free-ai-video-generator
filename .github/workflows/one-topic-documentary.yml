name: One Topic Game Documentary

on:
  push:
    paths: ['config/topics.json']
  workflow_dispatch:
    inputs:
      topic:
        description: '繁體中文遊戲題材（缺乏可信資料或合法畫面會明確失敗）'
        required: true
        type: string
      minutes:
        description: '目標分鐘數'
        type: choice
        default: '12'
        options: ['10', '12', '15']
      tts:
        description: '旁白：Edge 台灣中文；Kokoro CPU 普通話'
        type: choice
        default: edge
        options: [edge, kokoro]
  schedule:
    # 09:20 Asia/Taipei. Queue is empty until configured.
    - cron: '20 1 * * *'

permissions:
  contents: read
  models: read

concurrency:
  group: game-documentary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-documentary.txt
      - name: Check daily queue
        id: queue
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          topics = json.load(open('config/topics.json', encoding='utf-8'))
          assert isinstance(topics, list) and len(topics) <= 3
          assert all(isinstance(t, str) and t.strip() and len(t) <= 500 for t in topics)
          active = os.environ['EVENT'] == 'workflow_dispatch' or bool(topics)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          if not active:
              print('Daily queue empty; no production attempted.')
          PY
      - name: Install CPU tools
        if: steps.queue.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-documentary.txt
      - name: Optional Kokoro CPU
        if: steps.queue.outputs.active == 'true' && inputs.tts == 'kokoro'
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro>=0.9.4,<1' 'misaki[zh]>=0.8.2,<1' soundfile
      - name: Record prerequisite diagnosis without network calls
        if: steps.queue.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://models.github.ai/inference' }}
          TTS: ${{ inputs.tts || 'edge' }}
        run: python -m documentary.doctor --tts "$TTS" --out output/environment-diagnosis.json
      - name: Produce and enforce all gates
        if: steps.queue.outputs.active == 'true'
        env:
          TOPIC: ${{ inputs.topic }}
          MINUTES: ${{ inputs.minutes || '12' }}
          TTS: ${{ inputs.tts || 'edge' }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://models.github.ai/inference' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-4.1' }}
          LLM_MAX_CALLS: '180'
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            python topic_pipeline.py --topic "$TOPIC" --minutes "$MINUTES" --tts "$TTS"
          else
            python topic_pipeline.py --topics-file config/topics.json --minutes "$MINUTES" --tts "$TTS"
          fi
      - name: Publish diagnostic summary
        if: always() && steps.queue.outputs.active == 'true'
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          reports = sorted(Path('output/documentaries').glob('*/qa_report.json'))
          chunks = ['# Documentary run results\n\n']
          if not reports:
              chunks.append('No production report was created. Check installation and prerequisite diagnosis.\n\n')
          for path in reports:
              report = json.loads(path.read_text(encoding='utf-8'))
              chunks.append('<pre>' + html.escape(json.dumps(report, ensure_ascii=False, indent=2)) + '</pre>\n\n')
          diagnosis = Path('output/environment-diagnosis.json')
          if diagnosis.exists():
              chunks.append('<details><summary>Prerequisite metadata (does not prove service readiness)</summary><pre>' + html.escape(diagnosis.read_text(encoding='utf-8')) + '</pre></details>\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(''.join(chunks))
          PY
      - name: Upload finished output and diagnostic reports
        if: always() && steps.queue.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: game-documentary-${{ github.run_id }}
          path: |
            output/environment-diagnosis.json
            output/documentaries/**/documentary.mp4
            output/documentaries/**/documentary.srt
            output/documentaries/**/thumbnail.jpg
            output/documentaries/**/ATTRIBUTION.md
            output/documentaries/**/*.json
          if-no-files-found: warn
          retention-days: 7
