name: Verify Kokoro CPU Chinese voice

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-kokoro-voice.yml']

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-documentary.txt
      - name: Install CPU system tools
        id: system
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk espeak-ng
      - name: Install compatible Kokoro CPU stack
        id: packages
        run: |
          mkdir -p output
          python -m pip install -r requirements-kokoro-cpu.txt 2>&1 | tee output/kokoro-install.log
      - name: Check all dependency constraints
        id: integrity
        run: python -m pip check 2>&1 | tee output/kokoro-integrity.log
      - name: Generate and decode actual Chinese speech without model API calls
        run: python -m documentary.preflight --voice-only --tts kokoro
      - name: Publish voice result
        if: always()
        env:
          SYSTEM: ${{ steps.system.outcome }}
          PACKAGES: ${{ steps.packages.outcome }}
          INTEGRITY: ${{ steps.integrity.outcome }}
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          # This job receives no model API key. Package errors are bounded and
          # URLs are withheld; never dump environment or credential files.
          for filename in ('kokoro-install.log', 'kokoro-integrity.log'):
              path = Path('output') / filename
              if not path.exists():
                  continue
              for line in path.read_text(errors='replace').splitlines()[-35:]:
                  if any(word in line for word in ('ERROR:', 'ModuleNotFoundError:', 'but you have', 'ResolutionImpossible')):
                      if '://' in line:
                          line = 'Package installation failed; inspect ' + filename
                      line = line[:500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error title=Kokoro installation::' + line)
          if not list(Path('output/environment-checks').glob('*/report.json')):
              print('::error title=Kokoro installation::No voice attempted; system=' + os.environ['SYSTEM'] + '; packages=' + os.environ['PACKAGES'] + '; integrity=' + os.environ['INTEGRITY'])
          for path in Path('output/environment-checks').glob('*/report.json'):
              report = json.loads(path.read_text(encoding='utf-8'))
              for name, check in report['checks'].items():
                  message = name + ': ' + json.dumps(check, ensure_ascii=False)
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  level = 'notice' if check['status'] == 'PASS' else 'error'
                  print('::' + level + ' title=Kokoro voice check::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
                  f.write('<pre>' + html.escape(json.dumps(report, ensure_ascii=False, indent=2)) + '</pre>\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokoro-voice-${{ github.run_id }}
          path: |
            output/kokoro-install.log
            output/kokoro-integrity.log
            output/environment-checks/**/report.json
            output/environment-checks/**/voice-sample.wav
            output/environment-checks/**/voice-sample.srt
          if-no-files-found: warn
          retention-days: 7
