name: One Topic History Video

on:
  push:
    # Queue mode: put 1–3 topics in config/history-topics.json and push. Clear the list afterwards.
    paths: ['config/history-topics.json']
  workflow_dispatch:
    inputs:
      topic:
        description: '歷史題目（繁體中文，例如：澳洲大戰鴕鳥）。找不到足夠證據或授權圖片會明確失敗，不會用無關素材補位'
        required: true
        type: string
      minutes:
        description: '目標分鐘數（成品必須落在 10–15 分鐘）'
        type: choice
        default: '12'
        options: ['10', '11', '12', '13', '14', '15']
      goal:
        description: '輸出階段：movie 完整影片；script 研究與腳本；research 證據'
        type: choice
        default: movie
        options: [movie, script, research]
      tts:
        description: '旁白：edge 台灣中文（失敗時自動改用 Kokoro）；kokoro 普通話'
        type: choice
        default: edge
        options: [edge, kokoro]
      upload:
        description: '完成後是否以「私人」上傳到 YouTube（需要設定 YT_* Secrets）'
        type: choice
        default: 'no'
        options: ['no', 'private']

permissions:
  contents: read

concurrency:
  group: history-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-documentary.txt
      - name: Check queue
        id: queue
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          topics = json.load(open('config/history-topics.json', encoding='utf-8'))
          assert isinstance(topics, list) and len(topics) <= 3
          assert all(isinstance(t, str) and t.strip() and len(t) <= 500 for t in topics)
          active = os.environ['EVENT'] == 'workflow_dispatch' or bool(topics)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('active=' + str(active).lower() + '\n')
          if not active:
              print('History queue empty; nothing to produce.')
          PY
      - name: Install CPU tools
        if: steps.queue.outputs.active == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-documentary.txt
      - name: Probe Edge voice
        id: edge
        if: steps.queue.outputs.active == 'true' && (inputs.goal || 'movie') == 'movie'
        continue-on-error: true
        run: |
          python - <<'PY'
          import asyncio, os
          import edge_tts
          async def main():
              got = False
              async for msg in edge_tts.Communicate("測試", voice="zh-TW-YunJheNeural").stream():
                  got = got or msg["type"] == "audio"
              return got
          ok = False
          try:
              ok = asyncio.run(main())
          except Exception as exc:
              print('Edge voice unavailable:', type(exc).__name__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ok=' + str(ok).lower() + '\n')
          PY
      - name: Install Kokoro CPU voice (selected, or fallback when Edge is unavailable)
        if: steps.queue.outputs.active == 'true' && (inputs.goal || 'movie') == 'movie' && ((inputs.tts || 'edge') == 'kokoro' || steps.edge.outputs.ok != 'true')
        run: |
          sudo apt-get install -y espeak-ng
          python -m pip install -r requirements-kokoro-cpu.txt
      - name: Produce video and enforce all gates
        id: produce
        if: steps.queue.outputs.active == 'true'
        env:
          TOPIC: ${{ inputs.topic }}
          MINUTES: ${{ inputs.minutes || '12' }}
          TTS: ${{ inputs.tts || 'edge' }}
          EVENT: ${{ github.event_name }}
          GOAL: ${{ inputs.goal || 'movie' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_MAX_CALLS: '320'
        run: |
          if [ "$TTS" = edge ] && [ "${{ steps.edge.outputs.ok }}" != "true" ] && [ "$GOAL" = movie ]; then
            echo "::notice title=Voice::Edge voice unreachable, using Kokoro"
            TTS=kokoro
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            python -m documentary.history_pipeline --topic "$TOPIC" --minutes "$MINUTES" --tts "$TTS" --stop-after "$GOAL"
          else
            python -m documentary.history_pipeline --topics-file config/history-topics.json --minutes "$MINUTES" --tts "$TTS" --stop-after "$GOAL"
          fi
      - name: Upload privately to YouTube
        if: steps.produce.outcome == 'success' && inputs.upload == 'private' && (inputs.goal || 'movie') == 'movie'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          for dir in output/history/*/; do
            [ -f "$dir/documentary.mp4" ] && python -m documentary.youtube --dir "$dir"
          done
      - name: Publish run summary
        if: always() && steps.queue.outputs.active == 'true'
        run: |
          python - <<'PY'
          import html, json, os
          from pathlib import Path
          reports = sorted(Path('output/history').glob('*/qa_report.json'))
          chunks = ['# History video results\n\n']
          if not reports:
              chunks.append('No report was created. Check installation and credentials.\n\n')
          for path in reports:
              report = json.loads(path.read_text(encoding='utf-8'))
              chunks.append('<pre>' + html.escape(json.dumps(report, ensure_ascii=False, indent=2)) + '</pre>\n\n')
              diag = json.dumps(report.get('diagnostics', {}), ensure_ascii=False)
              print('::notice title=History result::status=' + str(report.get('status')) + '; stage=' + str(report.get('failed_stage') or report.get('current_stage')) + '; seconds=' + str(report.get('seconds')) + '; hook=' + str(report.get('hook_audit')) + '; music=' + str(report.get('music')) + '; calls=' + str(report.get('model_calls')) + '; ' + diag)
              if report.get('status') not in ('COMPLETE_AUTOMATED_CHECKS', 'SCRIPT_READY', 'RESEARCH_READY'):
                  blocker = report.get('blocker', {})
                  message = str(report.get('failed_stage', 'unknown')) + ': ' + str(blocker.get('code', 'UNKNOWN')) + ' — ' + str(blocker.get('detail', 'Inspect qa_report.json'))
                  message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=History video blocked::' + message[:1500])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(''.join(chunks))
          PY
      - name: Upload finished output and reports
        if: always() && steps.queue.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: history-video-${{ github.run_id }}
          path: |
            output/history/**/documentary.mp4
            output/history/**/documentary.srt
            output/history/**/thumbnail.jpg
            output/history/**/DESCRIPTION.txt
            output/history/**/ATTRIBUTION.md
            output/history/**/PROGRESS.md
            output/history/**/RESEARCH.md
            output/history/**/SCRIPT.md
            output/history/**/*.json
          if-no-files-found: warn
          retention-days: 7
