name: Documentary tests
on:
  pull_request:
  push:
    paths:
      - 'documentary/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'topic_pipeline.py'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-documentary.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r requirements-documentary.txt
          python -m pytest -q
